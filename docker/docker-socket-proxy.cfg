# The Docker API surface `autoheal` is allowed to reach — T71, ARCHITECTURE.md §17.2, §20.1.
#
# `autoheal` restarts containers whose health checks fail, which is what makes
# the worker heartbeat and the web check mean anything. Restarting is a write,
# so it used to hold `/var/run/docker.sock` itself — and the Docker API is root
# on the host: anything that can call it can create a privileged container that
# mounts `/`. A compromise of that one image was a compromise of the VPS.
#
# Mounting the socket `:ro` was deliberately not the answer. It protects the
# socket *file* from being replaced; every call this is about is a write made
# *through* it, and read-only changes none of them.
#
# So the socket moves behind this: HAProxy holds it, and publishes a second
# unix socket carrying exactly the two requests `autoheal` makes and nothing
# else. Everything unlisted is denied by the last rule, including every verb
# other than the ones paired below.
#
# **Fitted to `willfarrell/autoheal:1.2.0`, which is pinned in the compose
# file.** Its entrypoint issues exactly:
#
#     GET  /containers/json?filters={"health":["unhealthy"],"label":["gemone.autoheal=true"]}
#     POST /containers/<id>/restart?t=<timeout>
#
# Changing that pin means re-running the drill in §20.6, because a request
# shape this does not recognise fails closed — autoheal stops healing, which is
# a silence rather than an error.

global
    log stdout format raw daemon info
    maxconn 100

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout client 30s
    timeout server 30s

    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

frontend docker-api
    # A unix socket in a volume shared with `autoheal`, not a TCP listener.
    # There is no port, so there is nothing to expose to the host, to the
    # internal network, or to a future service that joins it by accident.
    bind unix@/run/docker-proxy/docker.sock mode 660

    # Listing containers, restricted to the ones autoheal is allowed to watch.
    # Without the query condition this would answer an unfiltered list — every
    # container on the host with its id and labels, which is the enumeration
    # step before restarting something that was never labelled.
    acl list_path    path_reg -i ^(/v[\d.]+)?/containers/json$
    acl label_filter urlp_reg(filters) -i gemone\.autoheal

    # Restarting one container by id. The id is not checkable here — the label
    # lives in the container, not in the request — so this is the capability
    # that genuinely remains. See T71.
    acl restart_path path_reg -i ^(/v[\d.]+)?/containers/[a-zA-Z0-9_.-]+/restart$

    http-request allow if METH_GET list_path label_filter
    http-request allow if METH_POST restart_path
    http-request deny

    default_backend docker

backend docker
    server docker /var/run/docker.sock
